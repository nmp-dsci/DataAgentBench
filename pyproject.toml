[project]
name = "dab-bench"
version = "0.1.0"
description = "An explorer over the DAB (DataAgentBench) benchmark: its datasets, questions, gold answers, validators and published trials, ingested from the upstream repo and served as a small app."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "typer>=0.15",
  "rich>=13.9",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "psycopg[binary]>=3.2",
  "duckdb>=1.1",
  "pymongo>=4.10",
  "huggingface-hub>=0.30",
  "pyarrow>=17",
  "pandas>=2.2",
  "claude-agent-sdk>=0.2.152",
  "mlflow>=3.12,<4",
  "sqlglot>=30.19.0",
]

[project.scripts]
dab = "dab_bench.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.14.2",
  "mypy>=1.13",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dab_bench"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dab_bench"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "bson", "bson.*", "duckdb", "mlflow", "mlflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"
